name: Delta count safety and bounded batch append
on:
  push:
    branches: ['experiment/dense-delta-safety-20261002']
    paths:
      - 'Audit~/DenseDeltaSafety/**'
      - '.github/workflows/dense-delta-safety.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.425'
      - name: Fault regression, full correctness and complete performance matrices
        run: python3 'Audit~/DenseDeltaSafety/run.py' --output artifacts/results --rounds 3
      - name: Reconstruct source and all raw evidence without filtering regressions
        run: python3 'Audit~/DenseDeltaSafety/review.py' --root artifacts/results
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: dense-delta-safety-${{ matrix.arch }}-${{ github.run_id }}
          path: artifacts/
          retention-days: 30
          if-no-files-found: error
  collect:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Redownload both originals and repeat their archived verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 'Audit~/DenseDeltaSafety/collect.py' reviewed
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dense-delta-safety-reviewed-${{ github.run_id }}
          path: reviewed/
          retention-days: 30
          if-no-files-found: error
