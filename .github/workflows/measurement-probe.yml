name: Dense measurement attribution (diagnostic only)
on:
  push:
    branches: [refactor/dense-only-indexed-20260928]
    paths: ['Audit~/measurement_probe.py', '.github/workflows/measurement-probe.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.425'
      - run: python3 'Audit~/measurement_probe.py'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: dense-measurement-probe-${{ github.run_id }}
          path: artifacts/measurement-probe/
          retention-days: 30
