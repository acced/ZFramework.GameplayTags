name: Bulk construction - x64 and ARM64
on:
  push:
    branches: ['experiment/bulk-construction-20261002']
    paths: ['Audit~/BulkConstruction/**', '.github/workflows/bulk-construction.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - cpu: x64
            runner: ubuntu-24.04
          - cpu: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 8.0.425
      - name: Archive exact checkout and unchanged production
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          git archive --format=zip HEAD > artifacts/source.zip
          git rev-parse HEAD > artifacts/SOURCE_COMMIT.txt
          git rev-parse 'HEAD^{tree}' > artifacts/SOURCE_TREE.txt
          git diff --exit-code 84729cc3b6e1b4681328806df2d7c8a1d8f568f6 HEAD -- Runtime Editor Samples~ Tests package.json
      - name: Full regression and complete bulk-construction measurements
        run: python3 'Audit~/BulkConstruction/run.py' --output artifacts/results --rounds 3
      - name: Independently reconstruct all samples and source identity
        run: python3 'Audit~/BulkConstruction/review.py' --root artifacts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bulk-${{ matrix.cpu }}-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
  collect:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Download exact artifacts and recheck both architectures
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 'Audit~/BulkConstruction/collect.py' reviewed
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bulk-reviewed-${{ github.run_id }}
          path: reviewed/
          if-no-files-found: error
          retention-days: 30
