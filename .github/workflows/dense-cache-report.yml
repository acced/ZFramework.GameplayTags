name: Frozen cache evidence and boundary readout
on:
  push:
    branches: ['experiment/dense-cache-20261002']
    paths: ['Audit~/DenseCacheReport/**','.github/workflows/dense-cache-report.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  readout:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Require the exact primary workflow to finish successfully
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run watch 36999746747 --exit-status --interval 30 > primary-wait.log
      - name: Redownload exact artifacts, rerun archived review and partition changed paths
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 'Audit~/DenseCacheReport/readout.py' readout
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: dense-cache-readout-${{ github.run_id }}
          path: |
            readout/
            primary-wait.log
          retention-days: 30
          if-no-files-found: error
