name: Packed bitmap audit (not release approval)
on:
  push:
    branches: [refactor/packed-bitmap-20260930]
permissions:
  contents: read
concurrency:
  group: packed-bitmap-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Alex-Rachel/GameplayTags
          ref: 28e4218f459ecf0e9fb4f0bca90805c05eb962c2
          path: .comparisons/alex
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.425'
      - name: Export exact source and pinned references
        run: |
          mkdir -p artifacts/references
          git archive --format=zip HEAD > artifacts/source.zip
          git rev-parse HEAD > artifacts/SOURCE_COMMIT.txt
          git archive --format=zip 934b14a47ddf0b6367bf6720be58c18cbcb09896 > artifacts/references/main.zip
          git archive --format=zip a99f53d4697df6f577961ff1ee1bad14caa221d1 > artifacts/references/optimize.zip
          git archive --format=zip 84729cc3b6e1b4681328806df2d7c8a1d8f568f6 > artifacts/references/auto.zip
          git -C .comparisons/alex archive --format=zip HEAD > artifacts/references/alex.zip
      - name: Existing semantic suite, exact examples and assembly boundaries
        run: python3 'Audit~/packed_compat.py' --output artifacts/compatibility
      - name: Compile literal shipping code, verify adoption and compare complete workloads
        run: python3 'Audit~/packed_acceptance.py' --references artifacts/references --output artifacts/results --rounds 3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: packed-bitmap-${{ github.run_id }}
          path: artifacts/
          retention-days: 30
          if-no-files-found: error
