name: Scoped Dense materialization - preserve public enumeration
on:
  push:
    branches: ['experiment/scoped-dense-20261002']
    paths:
      - 'Audit~/ScopedDense/**'
      - '.github/workflows/scoped-dense.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.425'
      - name: Archive exact source
        run: |
          mkdir -p artifacts
          git archive --format=zip HEAD > artifacts/source.zip
      - name: Full regressions and same-contract performance matrix
        run: python3 'Audit~/ScopedDense/run.py' --output artifacts/results --rounds 3
      - name: Independently reconstruct source and samples
        run: python3 'Audit~/ScopedDense/review.py' --root artifacts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: scoped-dense-${{ matrix.arch }}-${{ github.run_id }}
          path: artifacts/
          retention-days: 30
          if-no-files-found: error
  collect:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Redownload both exact artifacts and repeat verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 'Audit~/ScopedDense/collect.py' reviewed
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scoped-dense-reviewed-${{ github.run_id }}
          path: reviewed/
          retention-days: 30
          if-no-files-found: error
