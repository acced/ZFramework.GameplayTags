name: Integer runtime validation
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  correctness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.425'
      - name: Correctness and compatibility, not timing acceptance
        run: bash Tools~/Hardening/validate.sh "$RUNNER_TEMP/validation"
      - name: Unity asset metadata
        run: python3 Tests~/validate_package.py
      - name: Installable integer candidate
        run: python3 Tools~/Hardening/package.py "$RUNNER_TEMP/package"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integer-validation-${{ github.sha }}
          path: |
            ${{ runner.temp }}/validation/*.log
            ${{ runner.temp }}/validation/SUMMARY.txt
            ${{ runner.temp }}/package/*
