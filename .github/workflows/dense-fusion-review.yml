name: Independently recheck Dense fusion artifacts
on:
  push:
    branches: [experiment/robin-simd-dense-20261001]
    paths: ['Audit~/FusionReview/**', '.github/workflows/dense-fusion-review.yml']
permissions:
  contents: read
  actions: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: 36832367838
          pattern: dense-fusion-*
          path: inputs
      - name: Verify source trees and recompute every sample, rank and diagnostic independently
        run: python3 Audit~/FusionReview/recheck.py --input inputs --output reviewed
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: dense-fusion-reviewed-${{ github.run_id }}
          path: reviewed/
          retention-days: 30
          if-no-files-found: error
