name: Single-bit records - x64 and ARM64 verification
on:
  push:
    branches: ['experiment/single-bit-records-20261001']
    paths: ['Audit~/SingleBit/**', '.github/workflows/single-bit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - cpu: x64
            os: ubuntu-24.04
          - cpu: arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 8.0.425
      - name: Archive exact source and fixed controls
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/references
          git archive --format=zip HEAD > artifacts/source.zip
          git rev-parse HEAD > artifacts/SOURCE_COMMIT.txt
          git rev-parse 'HEAD^{tree}' > artifacts/SOURCE_TREE.txt
          git archive --format=zip 84729cc3b6e1b4681328806df2d7c8a1d8f568f6 > artifacts/references/auto.zip
          git archive --format=zip 9be85fcd1f8d1f594ceb5bc98f2ce234b398e0e0 > artifacts/references/micro.zip
          git archive --format=zip d45f21ffc5858a7ce9be68af9322924a774e40b4 > artifacts/references/fusion.zip
          git archive --format=zip 2866adfc6bfc21a11177c6b5873fbc54afebfe13 > artifacts/references/array.zip
      - name: Compile, verify invariants and run three process rounds
        run: python3 'Audit~/SingleBit/run.py' --output artifacts/results --rounds 3
      - name: Independently reconstruct trees and raw-sample results
        run: python3 'Audit~/SingleBit/recheck.py' --root artifacts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: singleton-${{ matrix.cpu }}-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
