name: Preparation v3 isolated Reset caller diagnostic
on:
  push:
    branches: ['experiment/preparation-v3-20261002']
    paths: ['Audit~/PreparationCaller/**', '.github/workflows/preparation-caller.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        include:
          - cpu: x64
            runner: ubuntu-24.04
          - cpu: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.425'
      - name: Same source with an isolated public Reset caller
        run: python3 'Audit~/PreparationCaller/run.py' caller
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: preparation-caller-${{ matrix.cpu }}-${{ github.run_id }}
          path: caller/
          retention-days: 30
          if-no-files-found: error
