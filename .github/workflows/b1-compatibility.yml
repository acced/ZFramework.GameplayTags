name: B1 compatibility
on:
  push:
    branches: [refactor/roadmap-b1-20261013]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  portable-correctness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.425'
      - name: Differential behavior and compatibility compile
        run: bash Tests~/Roadmap/run.sh
      - name: C1/C2 supplemental differential behavior
        run: |
          sha256sum -c Tests~/C12Correctness/SOURCE_SHA256SUMS
          bash Tests~/C12Correctness/run.sh \
            "B1=$GITHUB_WORKSPACE/Tests~/Roadmap/Baselines/B1/Runtime" \
            "PR4=$GITHUB_WORKSPACE/Tests~/C12Correctness/Baselines/PR4/Runtime" \
            "C1=$GITHUB_WORKSPACE/Tests~/C12Correctness/Baselines/C1/Runtime" \
            "current=$GITHUB_WORKSPACE/Runtime"
      - name: C3a experimental correctness and compatibility
        run: bash Tests~/C3aMeasurements/correctness.sh "$RUNNER_TEMP/c3a-correctness"
      - name: C1-removal diagnostic correctness and compatibility
        run: bash Tests~/C1RemovalDiagnostic/correctness.sh "$RUNNER_TEMP/c1-removal-correctness"
