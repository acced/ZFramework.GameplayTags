name: Query guard diagnostic
on:
  push:
    branches: [perf/compact-runtime-rewrite]
    paths:
      - 'Tests~/QueryGuardRecheck/**'
      - '.github/workflows/query-guard-recheck.yml'
permissions:
  contents: read
jobs:
  targeted-dotnet:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        amd_probe: [1, 2]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record CPU and require original AMD model for this recheck
        id: cpu
        shell: bash
        run: |
          mkdir -p .artifacts/query-host
          lscpu > .artifacts/query-host/lscpu.txt
          if grep -q "AMD EPYC 7763" /proc/cpuinfo; then
            echo "matched=true" >> "$GITHUB_OUTPUT"
            echo "Matched original AMD EPYC 7763 model; paired timing will run." > .artifacts/query-host/status.txt
          else
            echo "matched=false" >> "$GITHUB_OUTPUT"
            echo "CPU model did not match; no timing evidence or acceptance conclusion from this job." > .artifacts/query-host/status.txt
          fi
      - uses: actions/setup-dotnet@v4
        if: steps.cpu.outputs.matched == 'true'
        with:
          dotnet-version: 8.0.x
      - name: Freeze exact original and combined Union/workspace candidate
        if: steps.cpu.outputs.matched == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts/query-original .artifacts/query-candidate
          git archive f7c99546dbf029d70896c0f05e5119b19ffd6d26 Runtime | tar -x -C .artifacts/query-original
          git archive 3af34cba7c0e70c2fc8e3f3a5f1f930ebf079991 Runtime | tar -x -C .artifacts/query-candidate
      - name: Long-batch original Evolution operations, isolated A/A then A/B
        if: steps.cpu.outputs.matched == 'true'
        shell: bash
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
          DOTNET_TieredCompilation: '0'
          DOTNET_gcServer: '0'
          COMPlus_TieredCompilation: '0'
          COMPlus_gcServer: '0'
        run: |
          set -euo pipefail
          args=(--dotnet "$(readlink -f "$(command -v dotnet)")" --before .artifacts/query-original --after .artifacts/query-candidate --before-revision f7c99546dbf029d70896c0f05e5119b19ffd6d26 --after-revision 3af34cba7c0e70c2fc8e3f3a5f1f930ebf079991 --rounds 14 --iterations-file Tests~/QueryGuardRecheck/iterations.tsv)
          python3 Tests~/QueryGuardRecheck/isolated.py "${args[@]}" --mode aa --out .artifacts/query-aa
          python3 Tests~/QueryGuardRecheck/isolated.py "${args[@]}" --mode ab --out .artifacts/query-ab
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: query-amd-probe-${{ matrix.amd_probe }}-${{ github.sha }}
          path: |
            .artifacts/query-host/
            .artifacts/query-aa/
            .artifacts/query-ab/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
