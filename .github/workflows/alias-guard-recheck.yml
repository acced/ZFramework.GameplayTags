name: Mono alias guard diagnostic
on:
  push:
    branches: [perf/compact-runtime-rewrite]
    paths:
      - 'Tests~/AliasGuardRecheck/**'
      - '.github/workflows/alias-guard-recheck.yml'
permissions:
  contents: read
jobs:
  targeted-mono:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        amd_probe: [1, 2]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record CPU and require original AMD model for this recheck
        id: cpu
        shell: bash
        run: |
          mkdir -p .artifacts/alias-host
          lscpu > .artifacts/alias-host/lscpu.txt
          if grep -q "AMD EPYC 7763" /proc/cpuinfo; then
            echo "matched=true" >> "$GITHUB_OUTPUT"
            echo "Matched original AMD EPYC 7763 model; paired timing will run." > .artifacts/alias-host/status.txt
          else
            echo "matched=false" >> "$GITHUB_OUTPUT"
            echo "CPU model did not match; no timing evidence or acceptance conclusion from this job." > .artifacts/alias-host/status.txt
          fi
      - uses: actions/setup-dotnet@v4
        if: steps.cpu.outputs.matched == 'true'
        with:
          dotnet-version: 8.0.x
      - name: Install standalone Mono
        if: steps.cpu.outputs.matched == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y mono-devel
          mono --version
      - name: Freeze exact original and direct-enumerator candidate
        if: steps.cpu.outputs.matched == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts/alias-original .artifacts/alias-candidate
          git archive f7c99546dbf029d70896c0f05e5119b19ffd6d26 Runtime | tar -x -C .artifacts/alias-original
          git archive 856eee86c1d2c5288bb6f9e5efa33992b81d90ce Runtime | tar -x -C .artifacts/alias-candidate
      - name: Long-batch original Evolution operations, isolated A/A then A/B
        if: steps.cpu.outputs.matched == 'true'
        shell: bash
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
          DOTNET_TieredCompilation: '0'
          DOTNET_gcServer: '0'
          COMPlus_TieredCompilation: '0'
          COMPlus_gcServer: '0'
        run: |
          set -euo pipefail
          args=(--dotnet "$(readlink -f "$(command -v dotnet)")" --mono "$(command -v mono)" --before .artifacts/alias-original --after .artifacts/alias-candidate --before-revision f7c99546dbf029d70896c0f05e5119b19ffd6d26 --after-revision 856eee86c1d2c5288bb6f9e5efa33992b81d90ce --rounds 14 --iterations-file Tests~/AliasGuardRecheck/iterations.tsv)
          python3 Tests~/AliasGuardRecheck/run.py "${args[@]}" --mode aa --out .artifacts/alias-aa
          python3 Tests~/AliasGuardRecheck/run.py "${args[@]}" --mode ab --out .artifacts/alias-ab
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alias-amd-probe-${{ matrix.amd_probe }}-${{ github.sha }}
          path: |
            .artifacts/alias-host/
            .artifacts/alias-aa/
            .artifacts/alias-ab/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
