name: PR26 runtime refinement managed validation

on:
  push:
    branches: [refactor/runtime-adaptive-20261001]
    paths:
      - 'Audit~/PR26RefinementCI/source/**'
      - 'Audit~/PR26RefinementCI/inputs/**'
      - 'Audit~/PR26RefinementCI/provenance/**'
      - 'Audit~/PR26RefinementCI/run_ci.py'
      - 'Audit~/PR26RefinementCI/FeatureProbe.cs'
      - 'Audit~/PR26RefinementCI/source-selection.json'
      - 'Audit~/PR26RefinementCI/payload-sha256.json'
      - '.github/workflows/pr26-runtime-refinement.yml'
  workflow_dispatch:

permissions:
  contents: read

# Jobs preserve evidence on failure; a new push does not cancel an older measurement.
concurrency:
  group: pr26-runtime-refinement-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
  DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  correctness:
    if: github.ref == 'refs/heads/refactor/runtime-adaptive-20261001'
    name: correctness ${{ matrix.arch }} ${{ matrix.configuration }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: x64, configuration: net8-normal }
          - { runner: ubuntu-24.04, arch: x64, configuration: net8-checked }
          - { runner: ubuntu-24.04, arch: x64, configuration: netstandard-checked }
          - { runner: ubuntu-24.04-arm, arch: arm64, configuration: net8-normal }
          - { runner: ubuntu-24.04-arm, arch: arm64, configuration: net8-checked }
          - { runner: ubuntu-24.04-arm, arch: arm64, configuration: netstandard-checked }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.425'
      - name: Verify exact nested source and separate Runtime libraries
        timeout-minutes: 35
        run: >-
          python3 'Audit~/PR26RefinementCI/run_ci.py' correctness
          --expect-arch '${{ matrix.arch }}'
          --configuration '${{ matrix.configuration }}'
          --work '${{ runner.temp }}/pr26-ci'
      - name: Pack completed and partial evidence
        timeout-minutes: 3
        if: always()
        run: >-
          python3 'Audit~/PR26RefinementCI/run_ci.py' archive
          --work '${{ runner.temp }}/pr26-ci'
          --output '${{ runner.temp }}/pr26-evidence.zip'
      - name: Upload correctness evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr26-correctness-${{ matrix.arch }}-${{ matrix.configuration }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pr26-evidence.zip
          if-no-files-found: error
          retention-days: 30

  performance:
    if: github.ref == 'refs/heads/refactor/runtime-adaptive-20261001'
    needs: correctness
    name: performance ${{ matrix.arch }} ${{ matrix.group }} ${{ matrix.backend }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        arch: [x64, arm64]
        group: [query, builder, mixed, bridge]
        backend: [default, nohw]
        include:
          - { arch: x64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.425'
      - name: Run complete shard with fixed protocol
        timeout-minutes: 50
        run: >-
          python3 'Audit~/PR26RefinementCI/run_ci.py' benchmark
          --expect-arch '${{ matrix.arch }}'
          --group '${{ matrix.group }}'
          --backend '${{ matrix.backend }}'
          --work '${{ runner.temp }}/pr26-ci'
      - name: Pack completed and partial evidence
        timeout-minutes: 3
        if: always()
        run: >-
          python3 'Audit~/PR26RefinementCI/run_ci.py' archive
          --work '${{ runner.temp }}/pr26-ci'
          --output '${{ runner.temp }}/pr26-evidence.zip'
      - name: Upload raw samples, hashes and classifications even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr26-performance-${{ matrix.arch }}-${{ matrix.group }}-${{ matrix.backend }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pr26-evidence.zip
          if-no-files-found: error
          retention-days: 30
