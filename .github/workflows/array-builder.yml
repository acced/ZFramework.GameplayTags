name: Micro array builders - x64 and ARM64 evidence
on:
  push:
    branches: [experiment/micro-direct-build-20261001]
    paths: ['Audit~/ArrayBuild/**', '.github/workflows/array-builder.yml']
permissions:
  contents: read
concurrency:
  group: micro-array-build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 8.0.425
      - name: Exact source and immutable controls
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/references
          git archive --format=zip HEAD > artifacts/source.zip
          git rev-parse HEAD > artifacts/SOURCE_COMMIT.txt
          git rev-parse 'HEAD^{tree}' > artifacts/SOURCE_TREE.txt
          git archive --format=zip 84729cc3b6e1b4681328806df2d7c8a1d8f568f6 > artifacts/references/auto.zip
          git archive --format=zip 9be85fcd1f8d1f594ceb5bc98f2ce234b398e0e0 > artifacts/references/micro.zip
          git archive --format=zip d45f21ffc5858a7ce9be68af9322924a774e40b4 > artifacts/references/fusion.zip
      - name: Compile, regress, and measure complete operations
        run: python3 'Audit~/ArrayBuild/run.py' --output artifacts/results --rounds 3
      - name: Independent archive and raw sample recheck
        run: python3 'Audit~/ArrayBuild/recheck.py' --root artifacts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: micro-array-${{ matrix.arch }}-${{ github.run_id }}
          path: artifacts/
          retention-days: 30
          if-no-files-found: error
