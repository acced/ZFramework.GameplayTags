name: Mixed operations - word cursor and direct Dense output
on:
  push:
    branches: ['experiment/mixed-operations-20261002']
    paths:
      - 'Audit~/MixedOperations/**'
      - '.github/workflows/mixed-operations.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.425'
      - name: Archive exact source
        run: |
          mkdir -p artifacts
          git archive --format=zip HEAD > artifacts/source.zip
      - name: Full regression and same-input complete-operation benchmarks
        run: python3 'Audit~/MixedOperations/run.py' --output artifacts/results --rounds 3
      - name: Recompute raw samples and source identity
        run: python3 'Audit~/MixedOperations/review.py' --root artifacts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mixed-operations-${{ matrix.arch }}-${{ github.run_id }}
          path: artifacts/
          retention-days: 30
          if-no-files-found: error
