name: Integer runtime audit
on:
  push:
    branches: [main, optimize/whole-repo-20260916, refactor/runtime-index-bitset-20260920]
  pull_request:
    branches: [main, optimize/whole-repo-20260916]
permissions:
  contents: read
concurrency:
  group: integer-runtime-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Alex-Rachel/GameplayTags
          ref: 28e4218f459ecf0e9fb4f0bca90805c05eb962c2
          path: .comparisons/alex
          persist-credentials: false
      - name: Export immutable reference sources
        run: |
          mkdir -p artifacts
          git archive --format=zip 934b14a47ddf0b6367bf6720be58c18cbcb09896 > artifacts/main.zip
          git archive --format=zip a99f53d4697df6f577961ff1ee1bad14caa221d1 > artifacts/optimize.zip
          git -C .comparisons/alex archive --format=zip HEAD > artifacts/alex.zip
          git archive --format=zip HEAD > artifacts/source.zip
          git rev-parse HEAD > artifacts/SOURCE_COMMIT.txt
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.425'
      - name: Compile, verify and compare all four runtimes
        run: python3 'Audit~/integer_audit.py' --references artifacts --output artifacts/results --rounds 5
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: integer-runtime-${{ github.run_id }}
          path: artifacts/
          retention-days: 14
          if-no-files-found: error
