name: Temporary GameplayTags audit materialization
on:
  push:
    branches: [audit/chatgpt-gameplaytags-934b14a-20260915-7f3c]
    paths: [.github/workflows/audit-materialize.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 934b14a47ddf0b6367bf6720be58c18cbcb09896
          persist-credentials: false
      - name: Export exact baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir export
          git archive --format=zip --output=export/baseline.zip HEAD
          git ls-tree -r HEAD > export/baseline-tree.txt
          git rev-parse HEAD > export/baseline-commit.txt
          sha256sum export/baseline.zip > export/baseline-archive.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gameplaytags-baseline-934b14a
          path: export/*
          retention-days: 1
          if-no-files-found: error
      - name: Obtain verified public .NET SDK for offline validation
        shell: python
        run: |
          import hashlib, json, pathlib, urllib.request
          version = '8.0.423'
          metadata_url = 'https://dotnetcli.blob.core.windows.net/dotnet/release-metadata/8.0/releases.json'
          with urllib.request.urlopen(metadata_url, timeout=60) as response:
              metadata = json.load(response)
          sdks = [sdk for release in metadata['releases'] for sdk in [release.get('sdk', {})] + release.get('sdks', [])]
          sdk = next(s for s in sdks if s.get('version') == version)
          asset = next(f for f in sdk['files'] if f['rid'] == 'linux-x64' and f['url'].endswith('.tar.gz'))
          if not asset['url'].startswith('https://builds.dotnet.microsoft.com/'):
              raise RuntimeError('Unexpected SDK download origin')
          destination = pathlib.Path('compiler')
          destination.mkdir()
          archive = destination / 'dotnet-sdk.tar.gz'
          digest = hashlib.sha512()
          with urllib.request.urlopen(asset['url'], timeout=120) as source, archive.open('wb') as output:
              while chunk := source.read(1024 * 1024):
                  output.write(chunk)
                  digest.update(chunk)
          if digest.hexdigest().lower() != asset['hash'].lower():
              raise RuntimeError('Official SDK SHA-512 mismatch')
          (destination / 'sdk-source.json').write_text(json.dumps({'version': version, 'url': asset['url'], 'sha512': asset['hash']}, indent=2))
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gameplaytags-audit-dotnet-sdk
          path: compiler/*
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
